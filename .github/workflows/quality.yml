name: Quality

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Repository and Python gates
        run: python3 tools/quality_gate.py --static-only

# The full gate additionally requires the project's exact Godot 4.7 toolchain
# and remains a required local/release check: python3 tools/quality_gate.py
