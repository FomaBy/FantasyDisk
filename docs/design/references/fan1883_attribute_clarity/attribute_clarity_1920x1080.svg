<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <style>
    .bg { fill:#0a0b12 } .surface { fill:#17141a; stroke:#bd9149; stroke-width:4 } .zone { fill:#253543; stroke:#65bde7; stroke-width:2 } .card { fill:#211e26; stroke:#b98b45; stroke-width:3 } .cap { fill:#412826; stroke:#e59e65; stroke-width:2 } .ok { fill:#214334; stroke:#70d99a; stroke-width:2 } .muted { fill:#25262c; stroke:#737984; stroke-width:2; stroke-dasharray:8 6 } text { font-family:Arial, sans-serif; fill:#f3e4b2 } .h { font-size:31px; font-weight:bold } .sh { font-size:22px; font-weight:bold } .t { font-size:18px } .s { font-size:14px; fill:#c6d5df } .note { font-size:15px; fill:#87cdf3 } .warn { font-size:15px; fill:#f0b270 }
  </style>
  <rect class="bg" x="0" y="0" width="1920" height="1080"/>
  <text x="70" y="58" class="h">FAN-1883 · понятные атрибуты — 1920×1080 content-zone preview</text>
  <text x="70" y="88" class="note">Золото = существующая визуальная семья · голубое = runtime content safe zone · пунктир = отфильтровано, не карточка</text>

  <rect class="surface" x="70" y="130" width="860" height="390" rx="22"/>
  <text x="105" y="172" class="h">LEVEL UP</text>
  <text x="105" y="202" class="s">три применимых выбора; неэффективный или off-class выбор до ряда не доходит</text>
  <rect class="zone" x="115" y="225" width="770" height="215" rx="12"/>
  <rect class="card" x="135" y="245" width="215" height="175" rx="12"/>
  <text x="152" y="275" class="sh">Добавление урона</text><text x="152" y="304" class="s">Магический урон</text><text x="152" y="334" class="t">84 → 92</text><text x="152" y="362" class="s">реально: +8 урона</text>
  <rect class="card" x="407" y="245" width="215" height="175" rx="12"/>
  <text x="424" y="275" class="sh">Шанс крита</text><text x="424" y="304" class="t">34% → 39%</text><text x="424" y="332" class="s">реально: +5 п.п.</text><text x="424" y="360" class="warn">сейчас 34% · максимум 62%</text>
  <rect class="card" x="679" y="245" width="185" height="175" rx="12"/>
  <text x="696" y="275" class="sh">Регенерация</text><text x="696" y="304" class="s">Восстанавливаете</text><text x="696" y="326" class="s">HP со временем</text><text x="696" y="362" class="t">1.6 → 2.9 HP/с</text>
  <rect class="muted" x="115" y="455" width="360" height="40" rx="8"/><text x="132" y="481" class="s">class-ineligible / zero delta: нет в offer и нет пустого слота</text>
  <rect class="zone" x="505" y="455" width="380" height="40" rx="8"/><text x="522" y="481" class="s">focus drawer: длинный русский текст — scroll, без ellipsis</text>

  <rect class="surface" x="990" y="130" width="860" height="390" rx="22"/>
  <text x="1025" y="172" class="h">ATTRIBUTE SHOP</text>
  <text x="1025" y="202" class="s">сохраняет Gold shell; показывает только характеристику с фактической пользой</text>
  <rect class="zone" x="1035" y="225" width="770" height="215" rx="12"/>
  <rect class="card" x="1190" y="245" width="215" height="175" rx="12"/>
  <text x="1207" y="275" class="sh">Ловкость +1</text><text x="1207" y="304" class="s">Криты и темп атаки</text><text x="1207" y="338" class="t">36% → 36.5%</text><text x="1207" y="366" class="s">реально: +0.5 п.п.</text>
  <rect class="card" x="1462" y="245" width="215" height="175" rx="12"/>
  <text x="1479" y="275" class="sh">Выносливость +1</text><text x="1479" y="304" class="s">HP и защита</text><text x="1479" y="338" class="t">102 → 110 HP</text><text x="1479" y="366" class="s">реально: +8 HP</text>
  <rect class="zone" x="1080" y="455" width="680" height="40" rx="8"/><text x="1097" y="481" class="s">неподходящий параметр отфильтрован; 2 подходящие карты центрированы без пустого слота</text>

  <rect class="surface" x="70" y="570" width="860" height="430" rx="22"/>
  <text x="105" y="612" class="h">PAUSE / CODEX · ХАРАКТЕРИСТИКИ</text>
  <rect class="zone" x="112" y="640" width="180" height="310" rx="10"/><text x="137" y="680" class="sh">Навигация</text><text x="137" y="718" class="s">Герои</text><text x="137" y="748" class="s">Артефакты</text><text x="137" y="778" class="t">Характеристики</text>
  <rect class="zone" x="315" y="640" width="260" height="310" rx="10"/><text x="335" y="680" class="sh">Этот герой</text><rect class="ok" x="332" y="704" width="225" height="52" rx="7"/><text x="344" y="735" class="s">Увеличение урона · 18%</text><rect class="cap" x="332" y="770" width="225" height="58" rx="7"/><text x="344" y="799" class="s">Вампиризм · 20%</text><text x="344" y="819" class="warn">максимум достигнут</text><text x="335" y="875" class="note">off-class оси отсутствуют</text>
  <rect class="zone" x="600" y="640" width="285" height="310" rx="10"/><text x="620" y="680" class="sh">Понятно и полностью</text><text x="620" y="718" class="t">Вампиризм</text><text x="620" y="750" class="s">При ударе можете</text><text x="620" y="774" class="s">восстановить HP.</text><text x="620" y="820" class="t">сейчас 20% · максимум 20%</text><text x="620" y="853" class="s">Длинное объяснение — scroll.</text>

  <rect class="surface" x="990" y="570" width="860" height="430" rx="22"/>
  <text x="1025" y="612" class="h">HERO SELECT · ДОСЬЕ</text>
  <rect class="zone" x="1035" y="640" width="260" height="310" rx="10"/><text x="1092" y="685" class="sh">Портрет героя</text><circle cx="1165" cy="795" r="72" fill="#5a4934" stroke="#bd9149" stroke-width="3"/>
  <rect class="zone" x="1320" y="640" width="485" height="310" rx="10"/><text x="1345" y="680" class="sh">Что получит этот герой</text><text x="1345" y="716" class="t">Увеличение области атаки</text><text x="1345" y="742" class="s">Ауры, лучи, сектора и взрывы шире</text><text x="1345" y="782" class="t">Сила призыва</text><text x="1345" y="808" class="s">Показывать только при реальном consumer</text><text x="1345" y="848" class="t">Шанс крита: 28% · максимум 58%</text><text x="1345" y="884" class="note">Нет «слабых атрибутов»; длинное описание — dossier scroll</text>
  <text x="70" y="1045" class="note">Проверка: 4 surfaces × 3 viewport × normal / filtered-ineligible / capped / long-Russian-copy. В preview нет нового runtime asset.</text>
</svg>
